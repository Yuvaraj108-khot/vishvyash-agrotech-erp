<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vishvyash ERP</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #064e3b 0%, #065f46 60%, #047857 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-app-region: drag;
    overflow: hidden;
  }
  .logo {
    width: 76px; height: 76px;
    background: rgba(255,255,255,0.12);
    border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  }
  h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.3px; }
  .sub { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 4px; }
  .status {
    margin-top: 36px;
    display: flex; align-items: center; gap: 10px;
    font-size: 12.5px; color: rgba(255,255,255,0.75);
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #34d399;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.7); }
  }
  .bar-wrap {
    margin-top: 20px;
    width: 200px; height: 3px;
    background: rgba(255,255,255,0.15);
    border-radius: 99px;
    overflow: hidden;
  }
  .bar {
    height: 100%; width: 40%;
    background: #34d399;
    border-radius: 99px;
    animation: slide 1.4s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    50%  { transform: translateX(150%); }
    100% { transform: translateX(450%); }
  }
  .version {
    position: absolute; bottom: 16px;
    font-size: 10px; color: rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
  <div class="logo">🌿</div>
  <h1>Vishvyash Agrotech ERP</h1>
  <p class="sub">Biomass Briquettes Manufacturer &amp; Supplier</p>
  <div class="status">
    <div class="dot"></div>
    <span>Connecting to database…</span>
  </div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <div class="version">v1.0.0 — Desktop Edition</div>
</body>
</html>
